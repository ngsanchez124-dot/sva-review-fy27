   <div class="card links"><h3>${tr("Links","Links")}</h3>${links.map(([u,t])=>`<a href="${u}" target="_blank" rel="noopener"><span>${esc(t)}</span><span>${tr("Open","Öffnen")} ↗</span></a>`).join("")}</div>

const VIEWS={overview,team,certs,coverage,paths,commercial,program};
function render(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(e=>{const k=e.dataset.i;if(T[lang][k])e.textContent=T[lang][k];});
  document.getElementById("b-en").setAttribute("aria-pressed",lang==="en");document.getElementById("b-de").setAttribute("aria-pressed",lang==="de");
  const cur=(location.hash||"#overview").slice(1), view=VIEWS[cur]?cur:"overview";
  document.getElementById("rail").innerHTML=Object.keys(VIEWS).map(k=>`<a href="#${k}" ${k===view?'aria-current="page"':""}>${T[lang].nav[k]}</a>`).join("");
  Object.keys(VIEWS).forEach(k=>{const s=document.getElementById("v-"+k);s.classList.toggle("on",k===view);if(k===view)s.innerHTML=VIEWS[k]();});
  if(view==="team"){fillTeam();document.getElementById("q").oninput=fillTeam;document.getElementById("fs").onchange=fillTeam;}
  document.querySelectorAll(".copy").forEach(b=>b.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(b.dataset.c).then(()=>{b.textContent=tr("Copied","Kopiert");}).catch(()=>{});});
  document.getElementById("foot").innerHTML=`${tr("Prepared by Nikki Sanchez, Partner Success Manager, Helix","Erstellt von Nikki Sanchez, Partner Success Manager, Helix")} · ${T[lang].asOf} ${fd(DATA.asOf)} · ${tr("Course titles change over time; search Learn@Helix by product name if a title differs.","Kurstitel ändern sich; suchen Sie in Learn@Helix nach dem Produktnamen, falls ein Titel abweicht.")}`;
}
function setLang(l){lang=l;try{localStorage.setItem("sva-lang",l);}catch(e){}render();}
document.getElementById("b-en").onclick=()=>setLang("en");document.getElementById("b-de").onclick=()=>setLang("de");
document.getElementById("bannerBtn").onclick=()=>setLang(lang==="en"?"de":"en");
document.getElementById("themeBtn").onclick=()=>{const r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme: dark)").matches);r.dataset.theme=d?"light":"dark";};
window.addEventListener("hashchange",()=>{render();window.scrollTo({top:0});});
render();
</script>
